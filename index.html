<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Earthquake Monitoring System</title>
  <link rel="icon" href="logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- HTML Audio Elements -->
  <audio id="quakeSound" src="quakeFarNew.mp3" preload="auto"></audio>
  <audio id="quakeNearbySound" src="quakeClose.mp3" preload="auto"></audio>
  <audio id="alarmSound" src="ALARM_-_5_MAG_ABOVE.mp3" preload="auto"></audio>
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>

  <!-- Header with burger menu -->
  <div class="header-bar">
    <h1 class="header-title">SEISMIC MONITOR</h1>
    <div class="navbar-controls">
      <button class="burger-menu-btn" id="burgerMenuBtn" title="Toggle menu">
        <span class="burger-line"></span>
        <span class="burger-line"></span>
        <span class="burger-line"></span>
      </button>
      <button class="notification-bell" id="notificationBell" title="View notifications">
        🔔
        <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
      </button>
      <!-- NEW: Live viewers button -->
      <button class="presence-btn" id="presenceBtn" title="Who is viewing now?">
        <span class="presence-dot material-symbols-outlined">visibility</span>
        <span class="presence-count" id="presenceCount">0</span>
      </button>
    </div>
  </div>

  <!-- Menu overlay for mobile -->
  <div class="menu-overlay" id="menuOverlay"></div>

  <!-- Notification panel -->
  <div id="notificationPanel" class="notification-panel">
    <div class="notification-panel-header">
      <h6>Earthquake Alerts</h6>
      <button id="notificationPanelClose" class="notification-panel-close">&times;</button>
    </div>
    <div id="notificationPanelContent" class="notification-panel-content">
      <div class="notification-panel-empty">No notifications yet</div>
    </div>
  </div>

  <!-- NEW: Presence panel -->
<div id="presencePanel" class="presence-panel">
    <div class="presence-panel-header">
        <h6>Live Viewers</h6>
        <button id="presencePanelClose" class="presence-panel-close">&times;</button>
    </div>
    <div id="presencePanelContent" class="presence-panel-content">
        <div class="presence-panel-empty">No one else is viewing right now.</div>
    </div>
</div>
  <!-- Map -->
  <div id="map"></div>

  <!-- Control panel (burger menu) -->
  <div class="control-panel" id="controls">
    <h6>Monitoring Controls</h6>

    <label for="sourceSelector">Data Source</label>
    <select id="sourceSelector">
      <option value="phivolcs" selected>PHIVOLCS (Philippines)</option>
    </select>

    <hr>

    <label for="masterVolume">Master Volume</label>
    <input type="range" class="form-range" id="masterVolume" min="0" max="1" step="0.01">

    <button id="btnTestQuake">Test Alert</button>
    <button id="btnTestAlarm">Test 5.0+ Alarm</button>
    <button id="btnUnlockAudio">Unlock Audio</button>
    <button id="btnEnableNotifications">Enable Push Notifications</button>

    <hr>

    <label for="dateFilter">Time Range</label>
    <select id="dateFilter">
      <option value="today" selected>Today</option>
      <option value="week">This Week</option>
      <option value="month">This Month</option>
      <option value="year">This Year</option>
      <option value="custom">Custom</option>
    </select>

    <div id="customRange" style="display:none;">
      <label>Start Date</label>
      <input type="date" id="startDate">
      <label>End Date</label>
      <input type="date" id="endDate">
      <button id="btnApplyRange">Apply</button>
    </div>

    <button id="btnRefresh">Refresh Data</button>

    <hr>

    <label for="selInterval">Poll Interval</label>
    <select id="selInterval">
      <option>Manual</option>
    </select>

    <div class="status" id="status">Status: Initializing...</div>
  </div>

  <script src="https://unpkg.com/esri-leaflet@3.0.10/dist/esri-leaflet.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

</body>
